// ================= 渲染菜单 =================
const sidebarMenu = document.getElementById('sidebar-menu');

function renderMenu(items, level = 0) {
    let html = '';
    items.forEach(item => {
        const hasChildren = Array.isArray(item[2]); // 第三个元素是数组，说明有子菜单
        const paddingLeft = 12 + (level * 12);

        if (hasChildren) {
            // 父级菜单：格式 [name, icon, children]
            const [name, icon, children] = item;
            html += `
                <div class="menu-group">
                    <div class="menu-item flex items-center justify-between px-3 py-2.5 rounded-md cursor-pointer hover:bg-[#1e293b] text-sm transition-colors" 
                         style="padding-left: ${paddingLeft}px"
                         onclick="toggleSubmenu(this)">
                        <div class="flex items-center">
                            ${level === 0 ? `<i class="fa-solid ${icon} w-5 text-center mr-2 text-gray-400"></i>` : `<i class="fa-solid fa-circle text-[4px] w-5 text-center mr-2 text-gray-500"></i>`}
                            <span>${name}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-gray-500 arrow-rotate"></i>
                    </div>
                    <div class="submenu">${renderMenu(children, level + 1)}</div>
                </div>
            `;
        } else {
            // 叶子节点：格式 [name, path] 或 [name, path, id]
            const name = item[0];
            const path = item[1];
            const id = item[2]; // 可选
            html += `
                <div class="menu-item flex items-center px-3 py-2.5 rounded-md cursor-pointer hover:bg-[#1e293b] text-sm transition-colors"
                     style="padding-left: ${paddingLeft}px"
                     ${id ? `id="${id}"` : ''}
                     onclick="loadPage('${path}', '${name}', this)">
                    <i class="fa-solid fa-circle text-[4px] w-5 text-center mr-2 text-gray-500"></i>
                    <span>${name}</span>
                </div>
            `;
        }
    });
    return html;
}
sidebarMenu.innerHTML = renderMenu(menuData);

// ================= 交互逻辑 =================
function toggleSubmenu(element) {
    const submenu = element.nextElementSibling;
    const arrow = element.querySelector('.arrow-rotate');
    if (submenu.classList.contains('open')) {
        submenu.classList.remove('open');
        arrow.classList.remove('rotated');
    } else {
        submenu.classList.add('open');
        arrow.classList.add('rotated');
    }
}

function loadPage(path, title, element) {
    const iframe = document.getElementById('content-frame');
    const welcome = document.getElementById('welcome-screen');
    welcome.classList.add('hidden');
    iframe.classList.remove('hidden');
    iframe.src = path;
    document.getElementById('breadcrumb-title').textContent = title;

    document.querySelectorAll('.menu-item').forEach(el => {
        el.classList.remove('menu-item-active', 'text-white');
        el.classList.add('text-gray-300');
    });
    element.classList.add('menu-item-active', 'text-white');
    element.classList.remove('text-gray-300');

    let parent = element.parentElement;
    while (parent && parent !== sidebarMenu) {
        if (parent.classList.contains('submenu')) {
            parent.classList.add('open');
            const prevSibling = parent.previousElementSibling;
            if (prevSibling) {
                const arrow = prevSibling.querySelector('.arrow-rotate');
                if (arrow) arrow.classList.add('rotated');
            }
        }
        parent = parent.parentElement;
    }

    loadPageDescription(path, title);
}

// ================= 说明抽屉 =================
function toggleDescDrawer() {
    document.getElementById('desc-drawer').classList.toggle('open');
}

function loadPageDescription(path, title) {
    const descContent = document.getElementById('desc-content');
    document.getElementById('desc-page-name').textContent = title || '';
    const mdPath = path.replace(/\.html?$/i, '.md');
    descContent.innerHTML = '<p class="text-gray-400 text-sm">加载中...</p>';
    
    fetch(mdPath)
        .then(res => {
            if (!res.ok) throw new Error('Not found');
            return res.text();
        })
        .then(md => {
            descContent.innerHTML = marked.parse(md);
        })
        .catch(() => {
            descContent.innerHTML = `
                <div class="text-center py-8">
                    <i class="fa-regular fa-file-lines text-4xl text-gray-300 mb-3"></i>
                    <p class="text-gray-400 text-sm">暂无说明文件</p>
                    <p class="text-gray-300 text-xs mt-2">请在 <code class="bg-gray-100 px-1 rounded">${mdPath}</code> 中添加说明</p>
                </div>
            `;
        });
}

// ================= 供子页面调用的全局跳转 =================
window.navigateTo = function(targetPath, targetTitle) {
    let targetMenuElement = null;
    document.querySelectorAll('.menu-item').forEach(el => {
        const onclickAttr = el.getAttribute('onclick');
        if (onclickAttr && onclickAttr.includes(targetPath)) {
            targetMenuElement = el;
        }
    });

    const iframe = document.getElementById('content-frame');
    const welcome = document.getElementById('welcome-screen');
    welcome.classList.add('hidden');
    iframe.classList.remove('hidden');
    iframe.src = targetPath;
    document.getElementById('breadcrumb-title').textContent = targetTitle;

    document.querySelectorAll('.menu-item').forEach(el => {
        el.classList.remove('menu-item-active', 'text-white');
        el.classList.add('text-gray-300');
    });
    if (targetMenuElement) {
        targetMenuElement.classList.add('menu-item-active', 'text-white');
        targetMenuElement.classList.remove('text-gray-300');

        let parent = targetMenuElement.parentElement;
        while (parent && parent !== sidebarMenu) {
            if (parent.classList.contains('submenu')) {
                parent.classList.add('open');
                const prevSibling = parent.previousElementSibling;
                if (prevSibling) {
                    const arrow = prevSibling.querySelector('.arrow-rotate');
                    if (arrow) arrow.classList.add('rotated');
                }
            }
            parent = parent.parentElement;
        }
    }

    loadPageDescription(targetPath, targetTitle);
};
