        // ================= 渲染菜单逻辑 =================
        const sidebarMenu = document.getElementById('sidebar-menu');

        function renderMenu(items, level = 0) {
            let html = '';
            items.forEach(item => {
                const hasChildren = item.children && item.children.length > 0;
                const paddingLeft = 12 + (level * 12);
                
                if (hasChildren) {
                    html += `
                        <div class="menu-group">
                            <div class="menu-item flex items-center justify-between px-3 py-2.5 rounded-md cursor-pointer hover:bg-[#1e293b] text-sm transition-colors" 
                                 style="padding-left: ${paddingLeft}px"
                                 onclick="toggleSubmenu(this)">
                                <div class="flex items-center">
                                    ${level === 0 ? `<i class="fa-solid ${item.icon} w-5 text-center mr-2 text-gray-400"></i>` : `<i class="fa-solid fa-circle text-[4px] w-5 text-center mr-2 text-gray-500"></i>`}
                                    <span>${item.name}</span>
                                </div>
                                <i class="fa-solid fa-chevron-right text-xs text-gray-500 arrow-rotate"></i>
                            </div>
                            <div class="submenu">
                                ${renderMenu(item.children, level + 1)}
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="menu-item flex items-center px-3 py-2.5 rounded-md cursor-pointer hover:bg-[#1e293b] text-sm transition-colors"
                             style="padding-left: ${paddingLeft}px"
                             ${item.id ? `id="${item.id}"` : ''}
                             onclick="loadPage('${item.path}', '${item.name}', this)">
                            <i class="fa-solid fa-circle text-[4px] w-5 text-center mr-2 text-gray-500"></i>
                            <span>${item.name}</span>
                        </div>
                    `;
                }
            });
            return html;
        }

        // ================= 交互逻辑 =================
        function toggleSubmenu(element) {
            const submenu = element.nextElementSibling;
            const arrow = element.querySelector('.arrow-rotate');
            
            if (submenu.classList.contains('open')) {
                submenu.classList.remove('open');
                arrow.classList.remove('rotated');
            } else {
                submenu.classList.add('open');
                arrow.classList.add('rotated');
            }
        }
